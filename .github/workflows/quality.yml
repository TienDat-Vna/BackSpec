name: Quality Gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node bin/backspec.js validate
      - run: node bin/backspec.js sync --check
      - run: node bin/backspec.js quality . --strict --format sarif --output reports/backspec-quality.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.os }}-node-${{ matrix.node }}
          path: reports/backspec-quality.sarif
          if-no-files-found: ignore
